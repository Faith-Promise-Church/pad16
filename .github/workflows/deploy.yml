name: Deploy to GitHub Pages

# Publishes up to three builds to one Pages site:
#   /        the main branch (the app played today)
#   /next/   the live-rig branch (the gig build), while that branch exists
#   /v3/     the v3 branch (Perform and Edit modes, scenes), while that branch exists
# The workflow file that runs is the one on the branch that was pushed. The /v3/ step exists only on v3, so a push to main or
# live-rig republishes the site without /v3/ until v3 is pushed again (or this workflow is run by hand from v3).
# Each branch is built the way it needs: a branch with package.json is installed, tested and built with Vite;
# a branch without one is the original static app and is published as it is.

on:
  push:
    branches: [main, live-rig, v3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Install, test and build. Runs for every push, even when the deploy below is not allowed for the branch.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: main }

      - name: Check out the preview branches that exist
        id: next
        run: |
          repo="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          for pair in live-rig:next v3:v3; do
            branch="${pair%%:*}"; dir="${pair##*:}"
            if git ls-remote --exit-code --heads "$repo" "$branch" >/dev/null 2>&1; then
              git clone --depth 1 --branch "$branch" "$repo" "$dir"
              echo "$dir=true" >> "$GITHUB_OUTPUT"
            else
              echo "$dir=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The private sounds repository is never part of the published site: it holds licensed samples.
      # The web version reads it with an access key entered on each device (Edit, Setup, Sounds).
      - name: Build each branch
        env:
          PAD16_SOUNDS: none
        run: |
          set -e
          build() {            # build <source dir> <output dir>
            src="$1"; out="$2"
            mkdir -p "$out"
            if [ -f "$src/package.json" ]; then
              (cd "$src" && npm ci && npm run typecheck && npm test && npm run build)
              cp -R "$src/dist/." "$out/"
            else
              (cd "$src" && node scripts/build-kits.mjs)
              rsync -a --exclude .git --exclude .github --exclude scripts "$src/" "$out/"
            fi
          }
          build main _site
          if [ "${{ steps.next.outputs.next }}" = "true" ]; then build next _site/next; fi
          if [ "${{ steps.next.outputs.v3 }}" = "true" ]; then build v3 _site/v3; fi
          touch _site/.nojekyll
          ls -la _site

      - name: Browser tests on the branch that was pushed
        if: hashFiles(format('{0}/playwright.config.ts', github.ref_name == 'main' && 'main' || github.ref_name == 'v3' && 'v3' || 'next')) != ''
        working-directory: ${{ github.ref_name == 'main' && 'main' || github.ref_name == 'v3' && 'v3' || 'next' }}
        run: |
          npx playwright install --with-deps chromium webkit
          npx playwright test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publishing needs the github-pages environment to allow the branch:
  # Settings, Environments, github-pages, Deployment branches and tags.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
